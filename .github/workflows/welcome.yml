name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

# Least-privilege default (Qodo finding 3, 2026-07-06). The welcome job widens
# to issues:write + pull-requests:write below.
permissions:
  contents: read

jobs:
  welcome:
    runs-on: ubuntu-latest
    # 2026-05-24: skip on activity from the repo owner. actions/first-interaction
    # paginates the actor's full issue/PR history on every event, which exhausts
    # the GITHUB_TOKEN installation rate limit when the actor is the owner
    # (hundreds of issues/PRs). The owner is never a first-time contributor by
    # definition, so the call is pure waste.
    if: github.actor != github.repository_owner
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          pr_message: |
            Welcome to career-ops, @${{ github.actor }}! Thanks for your first PR.

            A few things to know:
            - Tests will run automatically — check the status below
            - Make sure you've linked a related issue (required for features)
            - Read [CONTRIBUTING.md](https://github.com/santifer/career-ops/blob/main/CONTRIBUTING.md) if you haven't

            We'll review your PR soon. Join our [Discord](https://discord.gg/8pRpHETxa4) if you have questions.
          issue_message: |
            Thanks for opening your first issue, @${{ github.actor }}! We'll take a look soon.

            In the meantime:
            - Check [SUPPORT.md](https://github.com/santifer/career-ops/blob/main/SUPPORT.md) for setup help
            - Join our [Discord](https://discord.gg/8pRpHETxa4) for quick answers
