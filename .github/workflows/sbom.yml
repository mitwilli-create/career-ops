name: SBOM Generation
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Generate SBOM (SPDX)
        # Pinned to v0.24.0 (Node 24, verified via raw action.yml runs.using).
        # Avoids the @v0 floating-tag regression risk — upstream could push a
        # Node-downgrade in a future v0.x without us noticing.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: career-ops-sbom.spdx.json
          format: spdx-json
          output-file: career-ops-sbom.spdx.json

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber: overwrite the SBOM if it's already attached to the release.
        # Without it, this step fails when a release is re-published, re-tagged,
        # or wrapped manually with an asset (2026-05-24: v1.8.0 anchor Release
        # created during release-please rate-limit debugging hit this exact fail).
        run: gh release upload --clobber ${{ github.event.release.tag_name }} career-ops-sbom.spdx.json
