language: en
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: false
    drafts: false
    base_branches:
    - main
    auto_incremental_review: false
  path_instructions:
  - path: CLAUDE.md
    instructions: This file controls agent behavior. Review changes very carefully
      for conflicts with existing instructions.
  - path: modes/_shared.md
    instructions: This file controls the scoring system. Any changes affect ALL evaluations.
      Flag anything that modifies scoring logic.
  - path: DATA_CONTRACT.md
    instructions: This file defines system vs user file boundaries. Changes here are
      critical — reject if user-layer files are being reclassified.
  - path: '**/*.mjs'
    instructions: Check for command injection, path traversal, and SSRF. Ensure scripts
      handle missing data/ directories gracefully.
  - path: dashboard/**
    instructions: Go TUI code. Check for proper error handling and ensure no hardcoded
      paths.
  finishing_touches:
    autofix:
      enabled: false
chat:
  auto_reply: false
