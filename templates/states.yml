# Career-Ops — Canonical States
# Source of truth for career-ops (writer) and dashboard (reader).
# Both systems MUST use these exact states.
#
# Rule: The status field in applications.md must contain EXACTLY
# one of these values (case-insensitive). No markdown bold (**),
# no dates, no extra text. Dates go in the date column.

states:
  - id: evaluated
    label: Evaluated
    aliases: [evaluada]
    description: Offer evaluated with report, pending decision
    dashboard_group: evaluated

  - id: applied
    label: Applied
    aliases: [aplicado, enviada, aplicada, sent]
    description: Application submitted
    dashboard_group: applied

  - id: responded
    label: Responded
    aliases: [respondido]
    description: Company has responded (not yet interview)
    dashboard_group: responded

  - id: interview
    label: Interview
    aliases: [entrevista]
    description: Active interview process
    dashboard_group: interview

  - id: offer
    label: Offer
    aliases: [oferta]
    description: Offer received
    dashboard_group: offer

  - id: rejected
    label: Rejected
    aliases: [rechazado, rechazada]
    description: Rejected by company
    dashboard_group: rejected

  - id: discarded
    label: Discarded
    # 2026-05-26 (PR #2 of the popout / discard / H-chip sweep) — SKIP
    # state deprecated and merged into Discarded. Both meant "candidate
    # decided not to apply" — keeping two distinct states added cognitive
    # load + UI surface area for no semantic gain. Existing SKIP rows in
    # data/applications.md were migrated in-place; legacy aliases retained
    # below so any historical writer / downstream consumer still emitting
    # SKIP / no_aplicar / monitor flows into Discarded cleanly.
    aliases: [descartado, descartada, cerrada, cancelada, skip, no_aplicar, no aplicar, monitor]
    description: Discarded by candidate, doesn't fit, or offer closed
    dashboard_group: discarded
