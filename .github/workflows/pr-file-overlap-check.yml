name: PR file overlap check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-overlap:
    name: Check for critical-file overlap with other open PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check for overlapping open PRs on critical files
        id: overlap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `bash -e` is the default for `run` blocks. Without `set +e` here,
          # the node line aborts the whole script on the script's intentional
          # exit-2 ("overlap detected, warn-only"), and the trailing
          # `EXIT_CODE=$?` + `exit 0` never run. Workflow then reports
          # failure even though the intent was a warning annotation.
          # Surfaced via PR #320 2026-05-29.
          set +e
          node scripts/check-pr-file-overlap.mjs ${{ github.event.pull_request.number }} > /tmp/overlap-report.txt 2>/tmp/overlap-stderr.txt
          EXIT_CODE=$?
          cat /tmp/overlap-stderr.txt >&2
          cat /tmp/overlap-report.txt
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0  # Never hard-fail CI — this is a warning annotation only

      - name: Comment overlap warning on PR
        if: steps.overlap.outputs.exit_code == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/overlap-report.txt', 'utf8');
            const body = [
              '## ⚠️ Critical file overlap detected',
              '',
              'This PR modifies files that are also modified by one or more other open PRs.',
              'Merging in the wrong order can produce structural merge conflicts.',
              '',
              '```',
              report,
              '```',
              '',
              '**This is a warning, not a block.** CI still passes. Merge order matters — coordinate before merging.',
              '',
              'See `AGENTS.md § Bug class: pr-conflict-mirage-from-parallel-shipping` for the triage + recovery playbook.',
            ].join('\n');

            // Only post a new comment if no existing overlap-warning comment exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Critical file overlap detected')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
