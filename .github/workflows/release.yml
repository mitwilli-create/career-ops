name: Release Please
# 2026-05-24: switched from `push: branches [main]` to `workflow_dispatch` only.
# Background: release-please-action@v4 was hitting GITHUB_TOKEN installation
# rate limits on every push because its commit-scan anchor was missing (manifest
# version 1.8.0 had no matching GitHub Release entry the action could find;
# package-name + tag-component config also mismatched). Three attempted config
# fixes did not stop the backfill. Manual-trigger keeps the option to cut a
# release on demand without auto-firing on every push.
#
# To cut a release: Actions tab → Release Please → Run workflow → main
# Or via CLI: gh workflow run release.yml --repo mitwilli-create/career-ops --ref main
#
# To re-enable auto-firing later: restore the `push: branches: [main]` block
# below. Before doing so, fix the underlying anchor mismatch — either set
# `include-component-in-tag: false` in release-please-config.json or rename
# tags to `career-ops-v<version>` to match the configured package-name.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
