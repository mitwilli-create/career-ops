# config/github-cleaner-personas.yml
#
# 16 verticals × 7 source platforms — defines the canvas Phase 2 of
# github-cleaner researches over. The per-model briefs (in
# lib/github-cleaner/rubric-cache.mjs:composePerModelBriefs) read this file
# to know which verticals each model should prioritize and which sources to
# canvas.
#
# Default weights are derived from Mitchell's cv.md content (verticals he's
# most demonstrated in get weight 1.0; aspirational verticals get 0.5-0.8).
# Edit weights here without touching code — the cache will invalidate on the
# personas.yml sha change automatically.
#
# See: data/github-cleaner-design-2026-05-22.md § Phase 2.
#
# Status: SKELETON — weights are first-pass estimates from the cv.md scan.
# The full build pass will derive these more rigorously from a cv-content
# analysis sub-routine.

version: 1
last_updated: 2026-05-22

# ─────────────────────────── 16 verticals ───────────────────────────────────
# Each vertical:
#   weight: 0.0–1.0 — how much weight the audit gives findings tagged to it
#   cluster: groups verticals for the rubric's vertical_lenses pivot view
#   demonstrated: true if Mitchell has shipped public work in this vertical
#   aspirational: true if this is a target lane he wants to move into
#   keywords: terms the council models search for in JDs / posts / threads
#   sample_role_titles: concrete titles that map to this vertical

verticals:
  communications:
    weight: 1.0
    cluster: communications
    demonstrated: true
    aspirational: false
    keywords: [communications, comms, internal comms, external comms, corporate comms, exec comms]
    sample_role_titles:
      - Head of Communications
      - Director of AI Communications
      - Senior Communications Manager
      - Communications Strategist

