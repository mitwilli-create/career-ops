language: en
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  # The QA contract says no hosted reviewer may run from a trigger, hook, scheduler, CI job,
  # pull request comment or unattended loop, and that CodeRabbit is a manual fallback that
  # needs a named per-run approval for a specific pull request. auto_review is exactly the
  # trigger that contract forbids, and it fired on this pull request without being asked.
  # The same setting was turned off in the working repository and never carried over here.
  # Turning this off does not remove CodeRabbit. A human can still request one review on
  # demand by commenting `@coderabbitai review` on a pull request, which is the approved shape.
  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "CLAUDE.md"
      instructions: "This file controls agent behavior. Review changes very carefully for conflicts with existing instructions."
    - path: "modes/_shared.md"
      instructions: "This file controls the scoring system. Any changes affect ALL evaluations. Flag anything that modifies scoring logic."
    - path: "DATA_CONTRACT.md"
      instructions: "This file defines system vs user file boundaries. Changes here are critical — reject if user-layer files are being reclassified."
    - path: "**/*.mjs"
      instructions: "Check for command injection, path traversal, and SSRF. Ensure scripts handle missing data/ directories gracefully."
    - path: "dashboard/**"
      instructions: "Go TUI code. Check for proper error handling and ensure no hardcoded paths."
chat:
  auto_reply: true
