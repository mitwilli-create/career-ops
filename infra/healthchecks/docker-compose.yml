# infra/healthchecks/docker-compose.yml — self-hosted Healthchecks for
# career-ops dead-man job heartbeats (convergence blueprint Phase 0).
#
# Adjudicated decision (dealbreaker-final-20260706-111713.md Impasse B):
# keep launchd as the scheduler, add SELF-HOSTED Healthchecks heartbeats
# (never the SaaS — timing metadata stays on-machine), do NOT adopt PM2.
#
# Image: official healthchecks/healthchecks, EXACT-PINNED per the
# convergence locked rule (no floating tags). License: BSD-3-Clause
# (healthchecks/healthchecks upstream) — no AGPL in the supervision layer.
# Bump the pin deliberately; never switch to :latest.
#
# Privacy posture:
#   - Binds 127.0.0.1 ONLY — never reachable off-machine.
#   - SQLite on a local named volume — no external DB, no egress.
#   - Job slugs are the only payload pinged (opaque labels, no personal data).
#   - Registration closed after the first (only) account.
#
# Bring-up: bash scripts/deploy/setup-healthchecks.sh   (or: docker compose up -d)
# Runtime deps: Docker Desktop or OrbStack. NOT installed as of 2026-07-07 —
# named blocking condition for the Phase 0 exit gate.

services:
  healthchecks:
    image: healthchecks/healthchecks:v4.2
    container_name: career-ops-healthchecks
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8000"
    environment:
      # SQLite keeps everything single-container + on-machine.
      DB: sqlite
      DB_NAME: /data/hc.sqlite
      # Long random string; generated by setup-healthchecks.sh into .env.hc
      SECRET_KEY: ${HC_SECRET_KEY:?run scripts/deploy/setup-healthchecks.sh to generate .env.hc}
      SITE_ROOT: http://127.0.0.1:8787
      SITE_NAME: career-ops heartbeats
      ALLOWED_HOSTS: "*"
      DEBUG: "False"
      # Single-operator instance: close self-serve registration. The first
      # account is created via manage.py in setup-healthchecks.sh.
      REGISTRATION_OPEN: "False"
      # Email alerting is optional; configure later via EMAIL_HOST_* if the
      # fleet-watchdog email path isn't sufficient.
    volumes:
      - hc-data:/data

volumes:
  hc-data:
