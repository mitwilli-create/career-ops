name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: npm install
      - name: Tokens drift check (finding-007 ARCH.41)
        # Verifies lib/heartbeat-tokens.json, lib/dashboard-tokens.mjs
        # (+ its .sha256 lockfile), and dashboard/css/tokens.css are in sync
        # with tokens/master.json.
        #
        # If this step fails, run `node scripts/transform-tokens.mjs` locally
        # and commit the regenerated files.
        #
        # Bypass (EMERGENCY ONLY): set TOKENS_SKIP_CI_GATE=1 in workflow env.
        # Always file a follow-up issue to remove the bypass within 24h.
        if: ${{ env.TOKENS_SKIP_CI_GATE != '1' }}
        run: node scripts/transform-tokens.mjs --check
      - name: Ghost-script lint (PR-07 documented-but-unbuilt cleanup)
        # Fails if any new code references scripts/<KNOWN_GHOST>.mjs that doesn't
        # exist in the repo. Comment-prefixed historical references are allowed.
        # See AGENTS.md § Bug class: documented-but-unbuilt for the broader pattern.
        run: node scripts/lint-ghost-scripts.mjs
      - run: node test-all.mjs --quick
